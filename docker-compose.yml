services:
  mqtt:
    image: eclipse-mosquitto:2.0
    volumes:
      - ./infrastructure/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t happyhealth/health -m ping -q 0"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      HAPPYHEALTH_ML_BASE_URL: http://ml-service:8000
      HAPPYHEALTH_MQTT_ENABLED: "true"
      HAPPYHEALTH_MQTT_BROKER_URL: tcp://mqtt:1883
    depends_on:
      mqtt:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  simulator:
    build:
      context: ./simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      PATIENT_ID: ${PATIENT_ID:-DEMO-001}
      PUBLISH_INTERVAL_SECONDS: ${PUBLISH_INTERVAL_SECONDS:-5}
      STARTUP_DELAY_SECONDS: ${STARTUP_DELAY_SECONDS:-5}
    depends_on:
      mqtt:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
